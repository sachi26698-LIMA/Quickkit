<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="QUICKKIT symbol">
  <defs>
    <linearGradient id="qk-ring" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#F018A8"/>
      <stop offset="0.24" stop-color="#D600E8"/>
      <stop offset="0.54" stop-color="#8B20F5"/>
      <stop offset="0.8" stop-color="#165BFF"/>
      <stop offset="1" stop-color="#08C9F2"/>
    </linearGradient>
    <linearGradient id="qk-orbit" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0" stop-color="#D600E8"/>
      <stop offset="0.42" stop-color="#8B20F5"/>
      <stop offset="0.75" stop-color="#165BFF"/>
      <stop offset="1" stop-color="#08C9F2"/>
    </linearGradient>
    <linearGradient id="qk-bolt" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#8B20F5"/>
      <stop offset="0.55" stop-color="#165BFF"/>
      <stop offset="1" stop-color="#08C9F2"/>
    </linearGradient>
    <linearGradient id="qk-spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B20F5"/>
      <stop offset="1" stop-color="#6420C8"/>
    </linearGradient>
    <radialGradient id="qk-planet" cx="0.36" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#2B1752"/>
      <stop offset="0.55" stop-color="#1A0F38"/>
      <stop offset="1" stop-color="#0E0822"/>
    </radialGradient>
    <linearGradient id="qk-tail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B20F5"/>
      <stop offset="1" stop-color="#165BFF"/>
    </linearGradient></defs>
  
    <!-- Q tail -->
    <path d="M 341 345 L 415 419" fill="none" stroke="url(#qk-tail)" stroke-width="44" stroke-linecap="round"/>
    <!-- orbit: back half (behind planet) -->
    <g transform="rotate(-22 256 288)">
      <path d="M 68 288 A 188 62 0 0 1 444 288" fill="none" stroke="url(#qk-orbit)" stroke-width="24" stroke-linecap="round"/>
    </g>
