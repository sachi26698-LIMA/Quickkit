      <stop offset="1" stop-color="#17132F" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="qk-tail" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#6A28D0"/>
      <stop offset="1" stop-color="#5D5AF0"/>
    </linearGradient></defs>
  
