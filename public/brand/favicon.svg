<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="QUICKKIT app icon">
  <defs>
    <linearGradient id="qk-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30105F"/>
      <stop offset="0.52" stop-color="#6420C8"/>
      <stop offset="1" stop-color="#8B20F5"/>
    </linearGradient>
    
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#qk-badge)"/>
  <g transform="translate(256 256) scale(0.82) translate(-222 -248)">
    
    <!-- orbit: back half (behind planet) -->
    <g transform="rotate(-20.6 238 278)">
      <path d="M 1 278 A 237 97 0 0 1 475 278" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
    </g>
    <!-- Q tail (wide flat wedge, rounded far end; near end tucks under the ring) -->
    <path d="M 313.9 353.3 L 393.6 442.8 Q 410.9 462.3 430.3 445.0 L 443.7 433.0 Q 463.1 415.7 445.9 396.3 L 366.1 306.7 Z" fill="#FFFFFF"/>
    <!-- main orbital ring -->
    <circle cx="222" cy="248" r="147" fill="none" stroke="#FFFFFF" stroke-width="38"/>
    <!-- planet disc (fills the ring opening edge to edge) -->
    <path fill-rule="evenodd" d="M 222 120 A 128 128 0 1 0 222 376 A 128 128 0 1 0 222 120 Z M 244 149 L 183 251 L 220 257 L 207 331 L 305 233 L 266 240 Z" fill="#FFFFFF"/>
    
    
    <!-- lightning bolt (colour variants; one-colour variants use the knockout) -->
    
    <!-- orbit: front half (over planet) -->
    <g transform="rotate(-20.6 238 278)">
      <path d="M 1 278 A 237 97 0 0 0 475 278" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
      
    </g>
    <!-- sparkles -->
    
    
  </g>
</svg>