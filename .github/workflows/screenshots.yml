name: Capture UI screenshots
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CAPTURE_SHOTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run the converter browser suite with screenshot capture
        run: npx playwright test tests/e2e/image-converter.spec.ts --project=chromium
      - name: Copy screenshots into docs/verification
        run: |
          mkdir -p docs/verification
          find test-results -name "*.png" -print0 | while IFS= read -r -d '' file; do
            cp "$file" "docs/verification/$(basename "$file")"
          done
          ls -la docs/verification
      - name: Commit screenshots to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/verification
          if git diff --cached --quiet; then
            echo "No new screenshots to commit."
          else
            git commit -m "docs(image-converter): add browser screenshots from CI"
            git push
          fi
