name: Capture UI screenshots
on:
  # Manual only. Runs from the default branch, where workflow_dispatch is
  # registered; the capture job commits its output back to the branch.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # A second capture would race the first one's push; queue instead.
  group: screenshots-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CAPTURE_SHOTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run the converter browser suite with screenshot capture
        run: npx playwright test tests/e2e/image-converter.spec.ts --project=chromium
      - name: Copy screenshots into docs/verification
        run: |
          mkdir -p docs/verification/examples
          find test-results -name "*.png" ! -path "*/examples/*" -print0 | while IFS= read -r -d '' file; do
            cp "$file" "docs/verification/$(basename "$file")"
          done
          find test-results -path "*/examples/*" -type f -print0 | while IFS= read -r -d '' file; do
            cp "$file" "docs/verification/examples/$(basename "$file")"
          done
          ls -la docs/verification docs/verification/examples
      - name: Commit screenshots to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/verification
          if git diff --cached --quiet; then
            echo "No new screenshots to commit."
          else
            git commit -m "docs(image-converter): add browser screenshots from CI"
            # The branch may have moved while the suite ran; rebase, then push.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
