name: Verify QUICKKIT
on:
  # Post-merge gate: main must be verified after every merge. This runs exactly
  # once per merged commit and is the check a required-status rule should name.
  push:
    branches: [main]
  # Pre-merge gate: every PR head is verified before it can land.
  #
  # Both events are kept deliberately — this narrows `push:` to main rather than
  # removing it, so post-merge validation is preserved.
  #
  # Why: a bare `push:` matched every branch, so each PR head started this
  # 35-minute workflow **twice**, doubling Actions cost for zero extra coverage.
  # The commit then carried two `verify` check runs with the same name — a
  # passing pull_request run and an independent push run. Because a single
  # check failure marks the git commit status `failure`, one flaky E2E test in
  # the redundant run turned the PR's merge state `UNSTABLE` even though the
  # pull_request run on the identical commit passed. Restricting `push:` to
  # main removes that ambiguity: one commit, one pre-merge check, and a separate
  # post-merge check on main.
  #
  # This does not address the E2E test's timing sensitivity itself, and is not
  # claimed to. See docs/QUICKKIT_CI_DUPLICATE_RUN_FIX.md.
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    # The full cross-browser suite plus focused regression runs can exceed 45
    # minutes on a busy runner; leave time for retries and failure artifacts.
    timeout-minutes: 65
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          # Sitemap lastmod checks need genuine file history, not a shallow boundary.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npm audit --omit=dev
      - run: npx playwright install --with-deps chromium firefox webkit
      # Catch cancellation regressions early while retaining the complete suite below.
      - run: npx playwright test tests/e2e/pdf-compressor.spec.ts --project=webkit --project=firefox --grep 'cancels a large batch' --repeat-each=2
      # Verify fixed preview dialogs stay interactive above the site header.
      - run: npx playwright test tests/e2e/pdf-to-word.spec.ts --project=chromium --project=firefox --project=webkit --grep 'previews the original PDF'
      - run: npm run test:e2e
        env:
          # Exercise the real visitor API without production credentials or data.
          ANALYTICS_DATABASE_URL: file:${{ runner.temp }}/quickkit-visitor-stats.db
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
          retention-days: 7
      # The converter spec writes real desktop/mobile screenshots; keep them
      # available even on a green run so the owner can review the result.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
